<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在岗 · 数字员工工作台</title>
    <!-- Apply the saved theme before first paint; the server allows this script by hash. -->
    <script>
      try {
        var theme = localStorage.getItem("agentd-theme")
        if (theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.remove("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
