# Set this to the installed OpenCode v2 executable to use persistent executor sessions.
opencode_binary: ""
listen: "127.0.0.1:8090"
model:
  endpoint: "http://localhost:8080/v1/chat/completions"
  name: "/Users/yejibing/models/Qwen3.8-27B-4bit"
  max_tokens: 2048
  timeout_seconds: 120
# Strong tier for critical actions (memory consolidation). Off by default:
# enabling it sends the owner's private-chat and local-run records, and the
# memory files, to this service. Any OpenAI-compatible chat-completions API.
strong_model:
  enabled: false
  endpoint: ""
  name: ""
  api_key: ""
  max_tokens: 0        # 0 lets the service decide
  timeout_seconds: 300
  max_steps: 40
  run_seconds: 1800
  max_context_bytes: 524288
# Optional per-run Dreaming models. Each entry authorizes its endpoint to
# process the same maintenance data as strong_model; scheduled runs still
# use strong_model. Put endpoint credentials only in config.local.yaml.
dream_models: {}
# Example replacement for the empty mapping above:
# dream_models:
#  example:
#    endpoint: "https://your-provider.example/v1/chat/completions"
#    name: "your-enabled-model"
#    timeout_seconds: 300
# Imported reference material. Markdown and text import directly; other
# formats (pdf, docx, pptx, xlsx, html, csv, epub) need a converter that takes
# the file path as its last argument and prints Markdown, e.g. ["markitdown"].
# It runs sandboxed without network; list the directories it must read, such
# as its virtualenv, in converter_paths.
knowledge:
  converter: []
  converter_paths: []
  converter_seconds: 120
limits:
  run_seconds: 240
  tool_seconds: 15
  max_steps: 12
  max_input_bytes: 16384
  max_output_bytes: 16384
  max_batch: 20
  max_history_messages: 24
  max_runs_per_hour: 120
  retry_base_ms: 1000
  debounce_ms: 1000
  poll_ms: 250
  approval_seconds: 3600
timezone: "Asia/Shanghai"
quiet_hours:
  start: "23:00"
  end: "08:00"
delivery_interval_ms: 1000
default_target: local
targets:
  local:
    kind: local
permissions:
  read_file: allow
  search: allow
  write_file: allow
  edit_file: allow
  set_timer: allow
  send_message: allow
  bash: deny
# Named HTTP operations are invoked through bash's `action` variant; never by
# handing production credentials or unrestricted network access to a shell.
actions: {}
# Example (enable only after configuring a real, intended destination):
# actions:
#   create_ticket:
#     mode: ask
#     url: https://example.invalid/tickets
#     method: POST
#     bearer_token: replace-in-config.local.yaml

# DingTalk IM: copy this file to ignored config.local.yaml before adding secrets.
dingtalk:
  progress_messages: true
  enabled: false
  client_id: ""
  client_secret: ""
  discovery_only: true
  allowed_sender: ""
  allow_all_groups: false # true accepts owner mentions in any group the bot has joined
  allowed_conversations: [] # explicit chat IDs; empty allows owner direct messages

# AI newsletter RSS subscriptions. Non-Chinese titles are translated locally.
news_feeds:
  - {name: 量子位, language: zh, url: "https://www.qbitai.com/feed"}
  - {name: TechCrunch AI, language: en, url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
  - {name: Google AI, language: en, url: "https://blog.google/innovation-and-ai/technology/ai/rss/"}
  - {name: Anthropic, language: en, url: "https://www.anthropic.com/news"}
  - {name: OpenAI, language: en, url: "https://openai.com/news/rss.xml"}
  - {name: Hugging Face, language: en, url: "https://huggingface.co/blog/feed.xml"}
  - {name: MIT News AI, language: en, url: "https://news.mit.edu/rss/topic/artificial-intelligence2"}
  - {name: AWS 机器学习, language: en, url: "https://aws.amazon.com/blogs/machine-learning/feed/"}
  - {name: NVIDIA 生成式 AI, language: en, url: "https://blogs.nvidia.com/blog/category/generative-ai/feed/"}
  - {name: MIT 科技评论 AI, language: en, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"}
  - {name: 法国世界报 AI, language: fr, url: "https://www.lemonde.fr/intelligence-artificielle/rss_full.xml"}

# One IM provider per process. Existing configs without im use DingTalk.
im:
  provider: dingtalk  # dingtalk | wecom
wecom:
  bot_id: ""
  secret: ""
  owner_userid: ""
  discovery_only: false
  progress_messages: true
  allow_all_groups: false # true accepts member mentions in every joined internal group
  allowed_groups: []  # internal group chatids when allow_all_groups is false
  group_leads: {}     # optional: "chatid": "responsible_userid"
  group_owner_tools: false # true grants every admitted group member the owner DM tool policy
  team_knowledge: ""  # role and materials approved for all enabled groups
